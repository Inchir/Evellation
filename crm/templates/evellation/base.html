<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Подключаем bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <title>Evellation</title>


    <!-- Подключаем собственный css-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/my_evellation.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/enter_token.css') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">




</head>
<body>
    <!-- Подключаем bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <div class="m-5">
     <button class="btn custom-btn" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
         ☰ Управление аккаунтами
        </button>
     </div>


    <div class="offcanvas offcanvas-start custom-offcanvas" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel" data-bs-backdrop="false">
      <div class="offcanvas-header border-bottom">
        <div>
                <div class="text-muted small">Пользователь</div>
                <h5 class="offcanvas-title sidebar-user mb-0" id="accountsMenuLabel">
                    {{ current_user.name }}
                </h5>
            </div>

        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Закрыть"></button>
      </div>
          <div class="offcanvas-body">
              <div class="sidebar-section-title">Навигация</div>
              <nav class="sidebar-nav">
                  <a class="btn custom-menu-btn" href="/" role="button">На главную</a>
                  <a class="btn custom-menu-btn" href="/my.evellation" role="button">Меню</a>
                  <a class="btn custom-menu-btn" href="/my.evellation/create.account" role="button">Добавить аккаунт</a>
                  <a class="btn custom-menu-btn" href="/my.evellation/token" role="button">Ввести токен</a>
              </nav>
        <div class="sidebar-section-title">Аккаунты</div>
              <div class="account-list">
                  {% for account in accounts %}
                    <a class="btn custom-menu-btn" href="/my.evellation/{{ account.id }}" role="button">{{ account.name }}</a>
                  {% endfor %}
              </div>
         </div>
      </div>
    <main role="main" class="container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
