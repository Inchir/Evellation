{% extends "evellation/base.html" %}

{% block content %}
<section class="ev-section py-5">
    <div class="container">

        <!-- Приветствие -->
        <div class="ev-card mb-4 p-4">
            <h2 class="ev-title mb-2">
                Добро пожаловать, {{ current_user.name }}!
            </h2>
        </div>

        <!-- Список аккаунтов -->
        <div class="ev-card p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Ваши аккаунты</h4>
            </div>

            <div class="ev-divider mb-3"></div>

            <!-- список -->
            <div class="ev-accounts-list">

                {% for account in accounts %}
                    <div class="ev-account-item">
                        <span class="ev-account-name">
                            {{ account.name }}
                        </span>

                    </div>
                {% endfor %}

            </div>

            <div class="ev-divider mt-3"></div>

            <!-- итог -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="text-muted">
                    Всего: {{ accounts|length }} аккаунта
                </span>
            </div>

        </div>

    </div>
</section>
{% endblock %}
