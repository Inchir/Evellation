<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Подключаем bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>{{ Title }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/style.css" />

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!--Пишем навигацию -->
    <nav class="navbar navbar-expand-lg navbar-light py-4" style="background-color: #5f90e3;">
      <div class="container"> <!-- Для отступов -->
          <a class="navbar-brand fs-2" style="color: white" href="/">
              <img src="/static/images/icon.bmp" alt="Logo" width="50" height="50" class="d-inline-block align-text-top">
              Evellation
            </a>

            <form class="form-inline my-2 my-lg-2">
                {% if current_user.is_authenticated %}
                    <a href="/my.evellation" class="btn btn-outline-light fs-3 " role="button">В личный кабинет</a>
                    <a href="/logout" class="btn btn-outline-light fs-3 ms-2" role="button">ВЫЙТИ</a>

                {% else %}
                    <a href="/sign_in" class="btn btn-outline-light fs-3 ms-2" role="button">ВОЙТИ</a>
                {% endif %}
            </form>
          </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <main role="main" class="container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
